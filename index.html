<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multivista de Twitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="drag-overlay"></div>

  <header id="topbar">
    <h1>Multivista <span>Twitch</span></h1>

    <form id="add-form">
      <input type="text" id="channel-input" placeholder="nombre del canal" autocomplete="off" maxlength="25">
      <button type="submit" class="btn btn-accent">Agregar canal</button>
    </form>
    <div id="add-error"></div>

    <div id="layout-controls">
      <label for="cols-select">Columnas</label>
      <select id="cols-select">
        <option value="auto">Auto</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
      <button type="button" id="reset-layout-btn" class="btn" title="Restablecer columnas, tamaños y orden">↺ Restablecer diseño</button>
      <button type="button" id="shared-chat-toggle" class="btn" title="Ver un solo chat compartido en vez de un chat por canal">💬 Chat compartido</button>
    </div>

    <div id="auth-area">
      <div id="auth-warning" hidden></div>
      <button id="login-btn" class="btn">Iniciar sesión con Twitch</button>
      <div id="user-chip" hidden>
        <span class="dot"></span>
        <span id="user-name"></span>
        <button id="logout-btn" class="icon-btn" title="Cerrar sesión">×</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div id="grid"></div>
    <div id="empty-state">
      Todavía no agregaste ningún canal.<br>
      Escribí un nombre de usuario de Twitch arriba y tocá <strong>«Agregar canal»</strong> para empezar a verlo.
    </div>

    <div id="shared-chat-resizer" class="tile-resizer" hidden></div>
    <div id="shared-chat" hidden>
      <div id="shared-chat-select" class="chat-dropdown-row"></div>
      <div id="shared-chat-frame-wrap"></div>
      <div id="shared-chat-targets" class="chat-dropdown-row"></div>
      <form id="shared-chat-send-form" class="chat-send-form">
        <input type="text" id="shared-chat-input" maxlength="500" placeholder="Enviar mensaje…">
        <button type="submit">➤</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
